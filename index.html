<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#3fa6c8"><title>Flitsvis</title><style>html,body{margin:0;width:100%;height:100%;background:#66cbe4;overflow:hidden}.load{position:fixed;inset:0;display:grid;place-items:center}.p{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#fff4dd 34%,#bfe7eb 73%,#7bc2cf);box-shadow:0 0 22px #ffffffbb;animation:a 1s ease-in-out infinite}@keyframes a{50%{transform:scale(.8);opacity:.6}}</style></head><body><div class="load"><div class="p"></div></div><script>(async()=>{const ps=['gameparts/game_00.txt','gameparts/game_01.txt','gameparts/game_02.txt'];const hs=await Promise.all(ps.map(async p=>{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw new Error(p);return r.text()}));document.open();document.write(hs.join(''));document.close()})().catch(e=>console.error(e));</script></body></html>

name: Flitsvis check

on:
  push:
    branches: ["codex/flitsvis-game"]
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "icon.svg"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.webmanifest
          test -s icon.svg
